name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel stale runs on push to same ref — avoids burning CPU on outdated commits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same Rust as the Dockerfile builder image (rust:1.88).
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal --component rustfmt --no-self-update && rustup default 1.88

      - name: Check formatting
        run: cargo fmt --check

  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build via Docker (aarch64)
        # Native arm64 runner (no QEMU). The full image is built, so the
        # runtime stage is covered too. There is no layer cache (a bare buildx
        # call gets no Actions cache token anyway).
        run: docker buildx build --platform linux/arm64 .

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # Same Rust as the Dockerfile builder image (rust:1.88).
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal --no-self-update && rustup default 1.88

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # sherpa-rs-sys is minimum-vendored: build.rs links the prebuilt .so
      # in vendor/sherpa-onnx/lib via SHERPA_LIB_PATH and uses the committed
      # src/bindings.rs — no C++ toolchain needed.
      - name: Run tests
        run: cargo nextest run --workspace --locked
        env:
          SHERPA_LIB_PATH: ${{ github.workspace }}/vendor/sherpa-onnx
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/sherpa-onnx/lib
