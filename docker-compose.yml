# Minimal docker-compose.yml for self-hosting ox-whisper.
# Generated/used by install.sh. Manual users: pin OX_WHISPER_VERSION, override paths.

services:
  ox-whisper:
    image: ghcr.io/anatolykoptev/ox-whisper:${OX_WHISPER_VERSION:-latest}
    container_name: ox-whisper
    restart: unless-stopped
    # Parakeet fp32 holds ~3.2 GB per pool slot and peaks ~4.3 GB on 5-minute
    # audio.
    mem_limit: ${OX_WHISPER_MEM_LIMIT:-7g}
    # The fp32/fp16 export keeps its weights in encoder.weights, which
    # onnxruntime resolves from the working directory.
    working_dir: /parakeet-models
    ports:
      - "127.0.0.1:8092:8092"   # transcription HTTP + WS
      - "127.0.0.1:9092:9092"   # Prometheus /metrics
    environment:
      MOONSHINE_PORT: "8092"
      OXWHISPER_PROM_PORT: "9092"
      MOONSHINE_THREADS: "${OX_WHISPER_THREADS:-4}"
      RUST_LOG: "${OX_WHISPER_LOG:-info}"
      PARAKEET_POOL_SIZE: "${OX_WHISPER_PARAKEET_POOL_SIZE:-1}"
      # keep Parakeet resident: a reload after eviction more than doubles RSS (#55)
      PARAKEET_IDLE_EVICT_SECS: "0"
    # Uploads and ffmpeg conversions go to /tmp. As a tmpfs it is emptied on every
    # container start (a file leaked by a killed process cannot survive a
    # restart) and bounded; it counts against mem_limit.
    tmpfs:
      - /tmp:size=1g
    volumes:
      - ${OX_WHISPER_MODELS:-./models}/vad:/vad:ro
      - ${OX_WHISPER_MODELS:-./models}/parakeet:/parakeet-models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8092/health"]
      interval: 30s
      timeout: 5s
      retries: 3
